plugins {
    id("com.google.devtools.ksp")
}

apply plugin: 'com.android.application'

android {
    compileSdk 37
    defaultConfig {
        applicationId "com.guillaumetousignant.payingcamel"
        minSdk 34
        targetSdk 37
        versionCode 116
        versionName '1.1.6'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
            arg("room.incremental", "true")
            arg("room.expandProjection", "true")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = 17
        targetCompatibility = 17
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    buildFeatures {
        viewBinding = true
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }

    ndkVersion = '30.0.16248370'
    namespace = 'com.guillaumetousignant.payingcamel'
    buildToolsVersion = '37.0.0'
    compileSdkMinor = 2
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'com.google.api:api-common:2.73.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Preferences, added
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.test:runner:1.7.0'

    // Room, added
    implementation 'androidx.room:room-runtime:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5' // For Kotlin use kapt instead of annotationProcessor // And then ksp instead of kapt
    // optional - Kotlin Extensions and Coroutines support for Room
    implementation 'androidx.room:room-ktx:2.8.5'
    // optional - RxJava support for Room
    implementation 'androidx.room:room-rxjava2:2.8.5'
    // optional - Guava support for Room, including Optional and ListenableFuture
    implementation 'androidx.room:room-guava:2.8.5'
    // Test helpers
    testImplementation 'androidx.room:room-testing:2.8.5'

    // Cardview
    implementation "androidx.cardview:cardview:1.0.0"

    // Floating Action Button Speed Dial
    implementation 'com.leinardi.android:speed-dial:3.3.0'

    // Recyclerview-selection
    implementation 'androidx.recyclerview:recyclerview-selection:1.2.0'

    // glide
    implementation 'com.github.bumptech.glide:glide:5.0.9'

    // Drive
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation('com.google.api-client:google-api-client-android:2.9.2') {
        exclude group: 'org.apache.httpcomponents'
        exclude module: 'guava-jdk5'
    }
    implementation('com.google.apis:google-api-services-drive:v3-rev20261023-2.9.2') {
        exclude group: 'org.apache.httpcomponents'
        exclude module: 'guava-jdk5'
    }

    // Drive take 2
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'

}
